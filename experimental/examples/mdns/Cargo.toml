[package]
edition = "2024"
name = "mdns"
version = "0.1.0"

[dependencies]
axum = "0.8.8"
confique = "0.4.0"
daemon-slayer = { path = "../../../crates/daemon-slayer", features = [
  "client-standard",
  "server-standard",
  "tray",
  "build-info",
  "socket-activation",
] }
daemon-slayer-network = { path = "../../daemon-slayer-network", features = [
  "cli",
] }
daemon-slayer-logging = { path = "../../../crates/daemon-slayer-logging", features = [
  "system",
] }
derive_more = { version = "2", default-features = false, features = ["as_ref"] }
futures = "0.3.30"
reqwest = "0.13.1"
serde = "1.0.204"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"


[[bin]]
name = "mdns-server1"
path = "src/bin/server1.rs"

[[bin]]
name = "mdns-server2"
path = "src/bin/server2.rs"

[build-dependencies]
vergen-gix = { version = "9", features = ["build", "cargo", "rustc", "si"] }
daemon-slayer = { path = "../../../crates/daemon-slayer", features = [
  "build-info",
] }
